<?xml version="1.0" encoding="UTF-8"?>
<!--
  شعار منصّة «سديد»
  الفكرة: شجرة قرار — وهي البنية الفعلية للنموذج (LightGBM: أشجار معزَّزة
  بالتدرّج) — يُضاء فيها مسار قرار واحد ينتهي عند هدف مُصاب، تجسيداً لمعنى
  «سديد»: الصائب الذي يُصيب مرماه.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-label="شعار منصة سديد">
  <defs>
    <linearGradient id="sdBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8ef7"/>
      <stop offset="1" stop-color="#22d3a0"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="116" height="116" rx="28" fill="url(#sdBg)"/>

  <!-- الفروع غير المسلوكة -->
  <g stroke="#fff" stroke-opacity=".42" stroke-width="4.5" stroke-linecap="round" fill="none">
    <path d="M60 28 38 58"/>
    <path d="M38 58 24 88"/>
    <path d="M38 58 46 88"/>
    <path d="M82 58 96 88"/>
  </g>
  <!-- مسار القرار المُضاء -->
  <g stroke="#fff" stroke-width="6.5" stroke-linecap="round" fill="none">
    <path d="M60 28 82 58"/>
    <path d="M82 58 71 88"/>
  </g>

  <!-- عُقد الشجرة -->
  <g fill="#fff">
    <circle cx="60" cy="28" r="8"/>
    <circle cx="82" cy="58" r="7.5"/>
    <circle cx="38" cy="58" r="6" fill-opacity=".5"/>
    <circle cx="24" cy="88" r="5" fill-opacity=".5"/>
    <circle cx="46" cy="88" r="5" fill-opacity=".5"/>
    <circle cx="96" cy="88" r="5" fill-opacity=".5"/>
  </g>

  <!-- الهدف المُصاب في نهاية المسار -->
  <circle cx="71" cy="88" r="12" fill="none" stroke="#fff" stroke-width="4"/>
  <circle cx="71" cy="88" r="5" fill="#fff"/>
</svg>
