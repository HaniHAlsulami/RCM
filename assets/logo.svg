<?xml version="1.0" encoding="UTF-8"?>
<!--
  شعار مؤقّت — ليس الشعار الرسمي لتجمع مكة الصحي.
  للاستبدال: ضع الملف الرسمي باسم assets/logo.svg (أو assets/logo.png)
  دون تعديل أي كود؛ الصفحات الثلاث تلتقطه تلقائياً.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-label="شعار الجهة">
  <defs>
    <linearGradient id="rcmLogoG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8ef7"/>
      <stop offset="1" stop-color="#22d3a0"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#rcmLogoG)"/>
  <!-- صليب طبي ذراعه العليا سهم صاعد: صحة + نموّ الإيراد -->
  <g fill="#fff">
    <path d="M60 17 87 47H33z"/>
    <rect x="52" y="43" width="16" height="58" rx="5"/>
    <rect x="30" y="59" width="60" height="16" rx="5"/>
  </g>
</svg>
